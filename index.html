<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPTV Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f0f">
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #0f0f0f;
            --bg-panel: #1a1a1a;
            --bg-hover: #2a2a2a;
            --bg-active: #3a3a3a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --accent: #e50914;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; user-select: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        /* Sidebar */
        .sidebar { width: 60px; background-color: var(--bg-panel); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 30px; border-right: 1px solid var(--border); z-index: 100; }
        .sidebar i { font-size: 20px; color: var(--text-muted); cursor: pointer; transition: 0.2s; }
        .sidebar i:hover, .sidebar i.active { color: var(--accent); }

        /* Categorías */
        .categories-panel { width: 240px; background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 90; }
        .panel-header { padding: 15px; font-size: 14px; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .search-box { background: var(--bg-base); border: 1px solid var(--border); padding: 8px; border-radius: 4px; color: white; width: 100%; outline: none; }
        .category-list { list-style: none; overflow-y: auto; flex-grow: 1; }
        .category-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .category-item:hover { background-color: var(--bg-hover); }
        .category-item.active { background-color: var(--bg-active); border-left: 3px solid var(--accent); font-weight: bold; }
        .cat-count { font-size: 10px; background: var(--bg-base); padding: 2px 6px; border-radius: 10px; color: var(--text-muted); }

        /* Contenido Principal */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* Reproductor */
        .player-section { display: flex; height: 50vh; background-color: #000; border-bottom: 1px solid var(--border); }
        .video-container { flex-grow: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; outline: none; }
        .program-info { width: 300px; background-color: var(--bg-panel); padding: 20px; display: flex; flex-direction: column; border-left: 1px solid var(--border); overflow-y: auto; }
        .info-tag { background: var(--accent); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 10px; align-self: flex-start; }
        .info-title { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .info-channel { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .info-channel img { width: 30px; height: 30px; object-fit: contain; border-radius: 4px; background: #fff; padding: 2px; }

        /* Lista de Canales (Grid estilo EPG simplificado) */
        .epg-section { flex-grow: 1; background-color: var(--bg-base); overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 15px; align-content: start; }
        .channel-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.2s; }
        .channel-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .channel-card img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 10px; background: rgba(255,255,255,0.1); border-radius: 4px; padding: 5px; }
        .channel-card .c-name { font-size: 13px; font-weight: 600; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 18px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { flex-direction: row; width: 100%; height: 60px; padding: 0 20px; border-right: none; border-bottom: 1px solid var(--border); justify-content: space-around; }
            .sidebar i { margin: 0 !important; }
            .categories-panel { display: none; width: 100%; height: 200px; }
            .categories-panel.mobile-active { display: flex; }
            .player-section { flex-direction: column; height: auto; }
            .video-container { height: 250px; }
            .program-info { display: none; }
        }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">
        <div class="loader"></div>
        <div id="loader-text">Cargando tu lista Xtream IPTV...<br><small>Esto puede tardar unos segundos dependiendo del tamaño de la lista.</small></div>
    </div>

    <div class="sidebar">
        <i class="fas fa-tv active" onclick="toggleCategories()"></i>
        <i class="fas fa-search" onclick="document.getElementById('search-input').focus()"></i>
    </div>

    <div class="categories-panel" id="cat-panel">
        <div class="panel-header">
            Grupos
            <input type="text" id="search-input" class="search-box" placeholder="Buscar canal..." onkeyup="searchChannels()">
        </div>
        <ul class="category-list" id="category-list"></ul>
    </div>

    <div class="main-content">
        <div class="player-section">
            <div class="video-container">
                <video id="video-player" controls autoplay playsinline></video>
            </div>
            <div class="program-info" id="program-info-panel">
                <div style="margin: auto; text-align: center; color: var(--text-muted);">
                    Selecciona un canal para reproducir
                </div>
            </div>
        </div>

        <div class="epg-section" id="channels-grid">
            <!-- Canales renderizados aquí -->
        </div>
    </div>

<script>
// --- DATOS DEL USUARIO (Capturados de la imagen) ---
const M3U_URL = "http://tv-70952.123gate.org:8080/get.php?username=TV-2685917907712&password=361555909697&type=m3u_plus&output=m3u8";

// PROXY PARA EVITAR ERRORES DE CORS y MIXED CONTENT (HTTPS -> HTTP)
const PROXY_URL = "https://api.allorigins.win/raw?url="; 

let allChannels = [];
let currentCategory = 'Todos';
let hlsInstance = null;

async function loadIPTV() {
    try {
        // Usamos el proxy para asegurar que funciona desde GitHub Pages o cualquier sitio HTTPS
        const response = await fetch(PROXY_URL + encodeURIComponent(M3U_URL));
        if (!response.ok) throw new Error("Error en la red");
        
        const m3uText = await response.text();
        document.getElementById('loader-text').innerText = "Procesando canales...";
        
        parseM3UFast(m3uText);
        
        renderCategories();
        filterCategory('Todos');
        
        document.getElementById('loader').style.display = 'none';

    } catch (error) {
        console.error(error);
        document.getElementById('loader-text').innerHTML = "<b>Error al cargar la lista.</b><br>Verifica tu conexión o los credenciales.";
    }
}

// Parser rápido optimizado para listas M3U Plus masivas (Series, Pelis, TV)
function parseM3UFast(data) {
    const lines = data.split('\n');
    let currentChannel = null;
    
    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
            // Extraer nombre del canal (lo que hay tras la última coma)
            let nameParts = line.split(',');
            let name = nameParts.length > 1 ? nameParts.pop().trim() : 'Canal';
            
            // Extraer logo y grupo
            let logoMatch = line.match(/tvg-logo="([^"]*)"/);
            let groupMatch = line.match(/group-title="([^"]*)"/);
            
            currentChannel = {
                name: name,
                logo: logoMatch ? logoMatch[1] : '',
                group: groupMatch ? groupMatch[1] : 'Sin Categoría'
            };
        } else if (line.startsWith('http') && currentChannel) {
            currentChannel.url = line;
            allChannels.push(currentChannel);
            currentChannel = null;
        }
    }
}

function renderCategories() {
    const groups = {};
    allChannels.forEach(c => {
        groups[c.group] = (groups[c.group] || 0) + 1;
    });

    // Ordenar grupos alfabéticamente
    const sortedGroups = Object.keys(groups).sort();
    
    const list = document.getElementById('category-list');
    list.innerHTML = `<li class="category-item active" onclick="filterCategory('Todos', this)">
                        <span>Todos</span> <span class="cat-count">${allChannels.length}</span>
                      </li>`;
    
    sortedGroups.forEach(group => {
        if(group.trim() !== '') {
            list.innerHTML += `<li class="category-item" onclick="filterCategory('${group.replace(/'/g, "\'")}', this)">
                                <span>${group}</span> <span class="cat-count">${groups[group]}</span>
                               </li>`;
        }
    });
}

function filterCategory(group, element = null) {
    currentCategory = group;
    if (element) {
        document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    }
    
    const filtered = group === 'Todos' ? allChannels : allChannels.filter(c => c.group === group);
    renderChannels(filtered);
}

function searchChannels() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
    
    document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
    renderChannels(filtered);
}

function renderChannels(channels) {
    const grid = document.getElementById('channels-grid');
    grid.innerHTML = '';
    
    // Solo renderizamos los primeros 200 para no bloquear el navegador si la lista es enorme
    const limit = Math.min(channels.length, 200);
    
    for (let i = 0; i < limit; i++) {
        const c = channels[i];
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `
            <img src="${c.logo}" onerror="this.src='https://via.placeholder.com/60/1a1a1a/ffffff?text=TV'">
            <div class="c-name">${c.name}</div>
        `;
        card.onclick = () => playChannel(c);
        grid.appendChild(card);
    }
    
    if (channels.length > 200) {
        grid.innerHTML += `<div style="grid-column: 1 / -1; text-align:center; padding: 20px; color: var(--text-muted);">
            Se muestran 200 canales. Usa el buscador para encontrar más.
        </div>`;
    }
}

function playChannel(channel) {
    const video = document.getElementById('video-player');
    
    if (Hls.isSupported() && channel.url.includes('.m3u8')) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(channel.url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
    } else {
        // Fallback para MP4/MKV (VOD) o si el navegador soporta HLS nativo (Safari)
        video.src = channel.url;
        video.play().catch(()=>{});
    }

    // Actualizar info panel
    const panel = document.getElementById('program-info-panel');
    if(panel) {
        panel.innerHTML = `
            <span class="info-tag">REPRODUCIENDO</span>
            <div class="info-channel">
                <img src="${channel.logo}" onerror="this.src='https://via.placeholder.com/30/1a1a1a/ffffff?text=TV'">
                <span>${channel.group}</span>
            </div>
            <div class="info-title">${channel.name}</div>
        `;
    }
    
    // En móviles, ocultar el panel de categorías al reproducir
    if (window.innerWidth <= 768) {
        document.getElementById('cat-panel').classList.remove('mobile-active');
    }
}

function toggleCategories() {
    if (window.innerWidth <= 768) {
        document.getElementById('cat-panel').classList.toggle('mobile-active');
    }
}

// Iniciar app
document.addEventListener('DOMContentLoaded', loadIPTV);
</script>
</body>
</html>
